name: Update NCA Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update_nca:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get current nca.txt checksum
        id: checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path nca.txt -Algorithm SHA256).Hash
          echo "original=$hash" >> $env:GITHUB_OUTPUT

      - name: Update NCA database from FuseNCA
        shell: pwsh
        run: |
          python scripts/update_nca_db.py

      - name: Check for changes
        id: check_changes
        shell: pwsh
        run: |
          $newHash = (Get-FileHash -Path nca.txt -Algorithm SHA256).Hash
          $oldHash = "${{ steps.checksum.outputs.original }}"
          if ($newHash -ne $oldHash) {
            echo "has_changes=true" >> $env:GITHUB_OUTPUT
            echo "NCA database has changed!"
          } else {
            echo "has_changes=false" >> $env:GITHUB_OUTPUT
            echo "No changes in NCA database"
          }

      - name: Get latest firmware version
        id: get_latest_fw
        if: steps.check_changes.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          # Get first [NCA] line which contains the latest firmware
          $line = Select-String -Path nca.txt -Pattern "\[NCA\]" | Select-Object -First 1
          if ($line) {
            $version = ($line.Line -split ' ')[1]
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "Latest firmware: $version"
          }

      - name: Download current GUI zip from 5.51 release
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Get the GUI zip asset URL from the 5.51 release
          $assetUrl = gh release view 5.51 --json assets --jq '.assets[] | select(.name | contains("GUI") and endswith(".zip")) | .url'
          if (-not $assetUrl) {
            Write-Error "No GUI zip asset found in release 5.51"
            exit 1
          }
          Write-Host "Found GUI asset URL: $assetUrl"

          # Download the asset using the browser_download_url
          $downloadUrl = gh api $assetUrl --jq '.browser_download_url'
          Write-Host "Download URL: $downloadUrl"

          # Download with proper headers for redirects
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $downloadUrl -OutFile "NxNandManager_v5.51_x64_GUI.zip" -Headers @{ "Accept" = "application/octet-stream" }
          Write-Host "Downloaded GUI zip"
          dir "NxNandManager_v5.51_x64_GUI.zip"

      - name: Update zip with new nca.txt
        if: steps.check_changes.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          $fwVersion = "${{ steps.get_latest_fw.outputs.version }}"

          # Extract the downloaded zip
          if (Test-Path "temp_zip") { Remove-Item -Recurse -Force "temp_zip" }
          Expand-Archive -Path "NxNandManager_v5.51_x64_GUI.zip" -DestinationPath "temp_zip" -Force

          # Replace nca.txt inside the extracted zip
          Copy-Item -Path "nca.txt" -Destination "temp_zip/" -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "temp_zip/nca.txt")) {
            # nca.txt might be in a subdirectory or have different casing
            Write-Host "nca.txt not at root, searching..."
            $ncaFiles = Get-ChildItem -Path "temp_zip" -Recurse -Filter "nca.txt" -File
            if ($ncaFiles) {
              Copy-Item -Path "nca.txt" -Destination $ncaFiles[0].FullName -Force
              Write-Host "Replaced nca.txt at $($ncaFiles[0].FullName)"
            } else {
              Write-Host "No existing nca.txt found, will add at root"
              Copy-Item -Path "nca.txt" -Destination "temp_zip/" -Force
            }
          } else {
            Write-Host "Replaced nca.txt at root"
          }

          # Repackage the zip
          if (Test-Path "NxNandManager_v5.51_x64_GUI.zip") { Remove-Item -Force "NxNandManager_v5.51_x64_GUI.zip" }
          Compress-Archive -Path "temp_zip/*" -DestinationPath "NxNandManager_v5.51_x64_GUI.zip" -Force
          Remove-Item -Recurse -Force "temp_zip"
          Write-Host "Created updated zip: $(Get-Item NxNandManager_v5.51_x64_GUI.zip | ForEach-Object { $_.Length }) bytes"

      - name: Commit nca.txt to repo
        if: steps.check_changes.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add nca.txt
          git commit -m "chore: update NCA database to firmware ${{ steps.get_latest_fw.outputs.version }}"
          git push

      - name: Delete old GUI zip asset from release
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Find the GUI zip asset ID to delete
          $assetId = gh release view 5.51 --json assets --jq '.assets[] | select(.name | contains("GUI") and endswith(".zip")) | .id'
          if ($assetId) {
            Write-Host "Deleting old asset ID: $assetId"
            gh api -X DELETE "repos/$((gh api /user --jq .login))/NxNandManager/releases/assets/$assetId"
            # Fallback: use full repo path
            $repo = "$env:GITHUB_REPOSITORY"
            gh api -X DELETE "repos/$repo/releases/assets/$assetId"
          } else {
            Write-Host "No existing GUI zip asset found to delete"
          }

      - name: Upload updated GUI zip to release
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload 5.51 "NxNandManager_v5.51_x64_GUI.zip" --clobber
          Write-Host "Uploaded updated GUI zip"

      - name: Update release description
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $fwVersion = "${{ steps.get_latest_fw.outputs.version }}"
          $date = (Get-Date -Format "yyyy-MM-dd HH:mm UTC")

          $notes = @"
# NxNandManager v5.51

## What's New

Version 5.51 introduces external NCA database support, eliminating the need to recompile the application when new Nintendo Switch firmware versions are released. Currently support up to firmware $fwVersion

## Major Changes

- **External NCA Database**: Firmware version detection now uses an external `nca.txt` file instead of hardcoded arrays
- **No Recompilation Required**: Simply edit `nca.txt` to add new firmware versions - no need to rebuild the application
- **Reduced Binary Size**: Removed 170+ lines of hardcoded NCA database entries

## How to Update for New Firmware

When a new Switch firmware is released:

1. Open `nca.txt` in a text editor
2. Add the new firmware entry in the format: `[NCA] <version> <filename> <title_id>`
3. Save the file
4. Done - no recompilation needed

Example entry:
[NCA] $fwVersion <sha256hash>.nca 0100000000000809
[NCA] $fwVersion <sha256hash>.nca 010000000000081B

## UI Improvements

- Progress bar now displays solid green instead of rainbow gradient
- Updated application icon

## Important Notes

- **nca.txt is required**: The application will not detect firmware versions without this file
- All other functionality remains unchanged from v5.50
- This version will receive updates only if the original author returns to enhance the project

## Technical Details

- Title ID `0100000000000809`: SystemVersion (firmware detection)
- Title ID `010000000000081B`: BootImagePackageExFat (exFAT driver detection)

## Database Update

- Database sourced from [FuseNCA](https://github.com/sthetix/FuseNCA)
- Auto-generated on: $date
- Total firmware versions supported: $([int]((Get-Content nca.txt | Select-String '\[NCA\]').Count))
"@

          # Write notes to file
          $notes | Out-File -FilePath "release_notes.md" -Encoding UTF8

          # Update the release
          gh release edit 5.51 --notes-file "release_notes.md"
          Write-Host "Updated release description to support firmware $fwVersion"
