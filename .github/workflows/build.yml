name: build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw64/mingw-w64-x86_64-qt5-static

      - name: Build CLI (without GUI)
        shell: msys2 {0}
        run: |
          cd NxNandManager

          # Temporarily disable GUI for CLI build
          sed -i 's/#define ENABLE_GUI  1/#define ENABLE_GUI  0/' gui/gui.h

          make clean
          make -j"$(nproc)"

          # Create CLI output directory
          mkdir -p "$GITHUB_WORKSPACE/bin-cli"
          cp NxNandManager.exe "$GITHUB_WORKSPACE/bin-cli/"
          cp virtual_fs/dokan/x64/dokan1.dll "$GITHUB_WORKSPACE/bin-cli/"

          # Copy OpenSSL DLLs
          shopt -s nullglob
          openssl_dlls=(/mingw64/bin/libcrypto*.dll /mingw64/bin/libssl*.dll)
          if [ ${#openssl_dlls[@]} -gt 0 ]; then
            cp "${openssl_dlls[@]}" "$GITHUB_WORKSPACE/bin-cli/" || true
          else
            echo "No OpenSSL DLLs found in /mingw64/bin — skipping copy"
          fi

          # Restore GUI setting
          sed -i 's/#define ENABLE_GUI  0/#define ENABLE_GUI  1/' gui/gui.h

      - name: Build GUI (with Qt5)
        shell: msys2 {0}
        run: |
          ln -s $(pwd) ~/NxNandManager
          cd ~/NxNandManager/NxNandManager/gui
          /mingw64/qt5-static/bin/qmake.exe NxNandManager.pro 'CONFIG += STATIC ARCH64'
          make -j"$(nproc)"

          # Create GUI output directory
          mkdir -p "$GITHUB_WORKSPACE/bin-gui"
          cp release/NxNandManager.exe "$GITHUB_WORKSPACE/bin-gui/"
          cp ../virtual_fs/dokan/x64/dokan1.dll "$GITHUB_WORKSPACE/bin-gui/"

      - uses: actions/upload-artifact@v4
        with:
          name: NxNandManager-CLI
          path: bin-cli/*

      - uses: actions/upload-artifact@v4
        with:
          name: NxNandManager-GUI
          path: bin-gui/*
