name: Build NxNandManager

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          make

    - name: Build
      shell: msys2 {0}
      run: |
        cd NxNandManager
        make clean
        make -j$(nproc)

    - name: Copy DLLs
      shell: msys2 {0}
      run: |
        cd NxNandManager
        cp virtual_fs/dokan/x64/dokan1.dll .
        cp lib/openssl/bin/*.dll .

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: NxNandManager-Windows-x64
        path: |
          NxNandManager/NxNandManager.exe
          NxNandManager/*.dll
        retention-days: 90
