name: build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools

      - name: Build CLI (without GUI)
        shell: msys2 {0}
        run: |
          cd NxNandManager

          # Temporarily disable GUI for CLI build
          sed -i 's/#define ENABLE_GUI  1/#define ENABLE_GUI  0/' gui/gui.h

          make clean
          make -j"$(nproc)"

          # Create CLI output directory
          mkdir -p "$GITHUB_WORKSPACE/bin-cli"
          cp NxNandManager.exe "$GITHUB_WORKSPACE/bin-cli/"
          cp virtual_fs/dokan/x64/dokan1.dll "$GITHUB_WORKSPACE/bin-cli/"

          # Copy OpenSSL DLLs
          shopt -s nullglob
          openssl_dlls=(/mingw64/bin/libcrypto*.dll /mingw64/bin/libssl*.dll)
          if [ ${#openssl_dlls[@]} -gt 0 ]; then
            cp "${openssl_dlls[@]}" "$GITHUB_WORKSPACE/bin-cli/" || true
          else
            echo "No OpenSSL DLLs found in /mingw64/bin — skipping copy"
          fi

          # Restore GUI setting
          sed -i 's/#define ENABLE_GUI  0/#define ENABLE_GUI  1/' gui/gui.h

      - name: Verify Qt5 installation
        shell: msys2 {0}
        run: |
          echo "Checking Qt5 installation..."
          ls -la /mingw64/include/ | grep -i qt || echo "No qt directories found in /mingw64/include/"
          find /mingw64/include -name "QMainWindow" -o -name "qmainwindow.h" 2>/dev/null || echo "QMainWindow header not found"
          ls -la /mingw64/lib/ | grep -i qt || echo "No Qt libraries found"
          qmake --version || echo "qmake not found"
          echo "Checking for pkg-config files..."
          ls -la /mingw64/lib/pkgconfig/ | grep -i qt || echo "No Qt pkg-config files"

      - name: Build GUI (with Qt5)
        shell: msys2 {0}
        run: |
          cd NxNandManager

          # Ensure GUI is enabled
          sed -i 's/#define ENABLE_GUI  0/#define ENABLE_GUI  1/' gui/gui.h

          # MSYS2 Qt5 uses QtCore, QtGui, QtWidgets (not Qt5Core)
          # Try to get Qt flags from pkg-config, with fallback to hardcoded paths
          if pkg-config --exists Qt5Core Qt5Gui Qt5Widgets 2>/dev/null; then
            echo "Using pkg-config for Qt5..."
            QT_CFLAGS=$(pkg-config --cflags Qt5Core Qt5Gui Qt5Widgets)
            QT_LIBS=$(pkg-config --libs Qt5Core Qt5Gui Qt5Widgets)
          elif pkg-config --exists QtCore QtGui QtWidgets 2>/dev/null; then
            echo "Using pkg-config for Qt (without version)..."
            QT_CFLAGS=$(pkg-config --cflags QtCore QtGui QtWidgets)
            QT_LIBS=$(pkg-config --libs QtCore QtGui QtWidgets)
          else
            echo "pkg-config failed, using hardcoded MSYS2 Qt5 paths..."
            QT_CFLAGS="-I/mingw64/include/qt5 -I/mingw64/include/qt5/QtCore -I/mingw64/include/qt5/QtGui -I/mingw64/include/qt5/QtWidgets"
            QT_LIBS="-L/mingw64/lib -lQt5Widgets -lQt5Gui -lQt5Core"
          fi

          echo "Qt CFLAGS: $QT_CFLAGS"
          echo "Qt LIBS: $QT_LIBS"

          # Update Makefile to include Qt paths and libs for GUI build
          sed -i "s|^CXXFLAGS=.*|CXXFLAGS=-std=c++11 -fexceptions -DUNICODE -D_UNICODE -fPIC -fpermissive $QT_CFLAGS|" Makefile
          sed -i "s|^LIBS=.*|LIBS=-lcrypto -lcrypt32 -lwsock32 -lws2_32 -Lvirtual_fs/dokan/x64/lib -ldokan1 -Llib/openssl/lib $QT_LIBS|" Makefile

          echo "Updated Makefile CXXFLAGS and LIBS:"
          grep "^CXXFLAGS=" Makefile
          grep "^LIBS=" Makefile

          make clean
          make -j"$(nproc)"

          # Create GUI output directory
          mkdir -p "$GITHUB_WORKSPACE/bin-gui"
          cp NxNandManager.exe "$GITHUB_WORKSPACE/bin-gui/"
          cp virtual_fs/dokan/x64/dokan1.dll "$GITHUB_WORKSPACE/bin-gui/"

          # Copy OpenSSL DLLs
          shopt -s nullglob
          openssl_dlls=(/mingw64/bin/libcrypto*.dll /mingw64/bin/libssl*.dll)
          if [ ${#openssl_dlls[@]} -gt 0 ]; then
            cp "${openssl_dlls[@]}" "$GITHUB_WORKSPACE/bin-gui/" || true
          fi

          # Copy Qt5 DLLs and platform plugins
          shopt -s nullglob
          qt5_dlls=(/mingw64/bin/Qt5Core.dll /mingw64/bin/Qt5Gui.dll /mingw64/bin/Qt5Widgets.dll)
          if [ ${#qt5_dlls[@]} -gt 0 ]; then
            cp "${qt5_dlls[@]}" "$GITHUB_WORKSPACE/bin-gui/" || true
          fi

          # Copy Qt platform plugin (required for GUI)
          if [ -d "/mingw64/share/qt5/plugins/platforms" ]; then
            mkdir -p "$GITHUB_WORKSPACE/bin-gui/platforms"
            cp /mingw64/share/qt5/plugins/platforms/qwindows.dll "$GITHUB_WORKSPACE/bin-gui/platforms/" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NxNandManager-CLI
          path: bin-cli/*

      - uses: actions/upload-artifact@v4
        with:
          name: NxNandManager-GUI
          path: bin-gui/*
