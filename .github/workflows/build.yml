name: build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-qt5-static

      - name: Verify Qt5-static installation
        shell: msys2 {0}
        run: |
          echo "=== Checking Qt5-static installation ==="
          pacman -Q | grep qt5 || echo "No qt5 packages found"

          echo -e "\n=== Searching for qmake ==="
          find /mingw64 -name "qmake.exe" 2>/dev/null || echo "qmake.exe not found anywhere in /mingw64"

          echo -e "\n=== Checking common Qt locations ==="
          ls -la /mingw64/qt5-static/ 2>/dev/null || echo "/mingw64/qt5-static/ not found"
          ls -la /mingw64/bin/qmake* 2>/dev/null || echo "No qmake in /mingw64/bin/"

          echo -e "\n=== Checking for Qt includes ==="
          find /mingw64 -type d -name "QtWidgets" 2>/dev/null | head -5 || echo "QtWidgets directory not found"

          echo -e "\n=== All installed files from qt5-static package ==="
          pacman -Ql mingw-w64-x86_64-qt5-static 2>/dev/null | grep -E "(bin/qmake|include/qt)" | head -30 || echo "Cannot list qt5-static files"

      - name: Build CLI (without GUI)
        shell: msys2 {0}
        run: |
          cd NxNandManager

          # Temporarily disable GUI for CLI build
          sed -i 's/#define ENABLE_GUI  1/#define ENABLE_GUI  0/' gui/gui.h

          make clean
          make -j"$(nproc)"

          # Create CLI output directory
          mkdir -p "$GITHUB_WORKSPACE/bin-cli"
          cp NxNandManager.exe "$GITHUB_WORKSPACE/bin-cli/"
          cp virtual_fs/dokan/x64/dokan1.dll "$GITHUB_WORKSPACE/bin-cli/"

          # Copy OpenSSL DLLs
          shopt -s nullglob
          openssl_dlls=(/mingw64/bin/libcrypto*.dll /mingw64/bin/libssl*.dll)
          if [ ${#openssl_dlls[@]} -gt 0 ]; then
            cp "${openssl_dlls[@]}" "$GITHUB_WORKSPACE/bin-cli/" || true
          else
            echo "No OpenSSL DLLs found in /mingw64/bin — skipping copy"
          fi

          # Restore GUI setting
          sed -i 's/#define ENABLE_GUI  0/#define ENABLE_GUI  1/' gui/gui.h

      - name: Build GUI (with Qt5)
        shell: msys2 {0}
        run: |
          ln -s $(pwd) ~/NxNandManager
          cd ~/NxNandManager/NxNandManager/gui
          /mingw64/qt5-static/bin/qmake.exe NxNandManager.pro 'CONFIG += STATIC ARCH64'
          make -j"$(nproc)"

          # Create GUI output directory
          mkdir -p "$GITHUB_WORKSPACE/bin-gui"
          cp release/NxNandManager.exe "$GITHUB_WORKSPACE/bin-gui/"
          cp ../virtual_fs/dokan/x64/dokan1.dll "$GITHUB_WORKSPACE/bin-gui/"

      - uses: actions/upload-artifact@v4
        with:
          name: NxNandManager-CLI
          path: bin-cli/*

      - uses: actions/upload-artifact@v4
        with:
          name: NxNandManager-GUI
          path: bin-gui/*
