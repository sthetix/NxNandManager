name: Auto-Update NCA Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-nca:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get current nca.txt checksum
        id: checksum
        run: |
          hash=$(sha256sum nca.txt | cut -d' ' -f1)
          echo "original=$hash" >> $GITHUB_OUTPUT

      - name: Update NCA database from FuseNCA
        run: python3 scripts/update_nca_db.py

      - name: Check for changes
        id: check_changes
        run: |
          new_hash=$(sha256sum nca.txt | cut -d' ' -f1)
          if [ "$new_hash" != "${{ steps.checksum.outputs.original }}" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
