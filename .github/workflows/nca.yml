name: Auto-Update NCA Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-nca:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get current nca.txt checksum
        id: checksum
        run: |
          hash=$(sha256sum nca.txt | cut -d' ' -f1)
          echo "original=$hash" >> $GITHUB_OUTPUT

      - name: Update NCA database from FuseNCA
        run: python3 scripts/update_nca_db.py

      - name: Check for changes
        id: check_changes
        run: |
          new_hash=$(sha256sum nca.txt | cut -d' ' -f1)
          if [ "$new_hash" != "${{ steps.checksum.outputs.original }}" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Get latest firmware version
        id: get_latest_fw
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          version=$(grep '\[NCA\]' nca.txt | head -1 | awk '{print $2}')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Download and update GUI zip
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 5.51 --pattern '*GUI*.zip' --dir . --clobber
          ZIP_FILE=$(ls NxNandManager_*_GUI.zip | head -1)
          rm -rf zip_tmp
          unzip -q "$ZIP_FILE" -d zip_tmp
          cp nca.txt zip_tmp/
          rm -f "$ZIP_FILE"
          cd zip_tmp && zip -rq ../"$ZIP_FILE" . && cd ..
          rm -rf zip_tmp

      - name: Update release
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FW_VERSION="${{ steps.get_latest_fw.outputs.version }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COUNT=$(grep -c '\[NCA\]' nca.txt || echo 0)

          {
            echo "# NxNandManager v5.51"
            echo ""
            echo "## What's New"
            echo ""
            echo "Version 5.51 introduces external NCA database support. Currently support up to firmware $FW_VERSION"
            echo ""
            echo "## Major Changes"
            echo ""
            echo "- **External NCA Database**: Uses an external \`nca.txt\` file"
            echo "- **No Recompilation Required**: Simply edit \`nca.txt\` to add new firmware versions"
            echo ""
            echo "## Database Update"
            echo ""
            echo "- Database sourced from [FuseNCA](https://github.com/sthetix/FuseNCA)"
            echo "- Auto-generated on: $DATE"
            echo "- Total firmware versions supported: $COUNT"
          } > release_notes.md

          ZIP_FILE=$(ls NxNandManager_*_GUI.zip | head -1)

          for asset_url in $(gh api repos/${{ github.repository }}/releases/tags/5.51 --jq '.assets[] | select(.name | contains("GUI") and endswith(".zip")) | .url'); do
            gh api -X DELETE "$asset_url"
          done

          gh release upload 5.51 "$ZIP_FILE"
          gh release edit 5.51 --notes-file release_notes.md
          rm -f "$ZIP_FILE" release_notes.md

      - name: Commit database changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nca.txt
          git commit -m "chore: update NCA database to firmware ${{ steps.get_latest_fw.outputs.version }}"
          git push
